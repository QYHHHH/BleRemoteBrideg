# MiRemoteBridge - 打 tag 自动编译并发布固件
#
#   git tag v0.0.6 && git push origin v0.0.6     # 正常路径
#   或 Actions 里手动跑，填版本号（会顺带创建这个 tag）
#
# 出三个东西：
#   1. MiRemoteBridge-<ver>.merged.bin  全片镜像，网页一键烧录 / 全新装机
#   2. MiRemoteBridge-<ver>-app.bin     只写 0x10000 的应用，升级用，配置全留
#   3. manifest.json                    ESP Web Tools 清单，分块写、不清配置
#
# 另外三个几十 KB 的小文件（bootloader / partitions / boot_app0）是第 3 项
# 分块 manifest 的零件，不是给用户单独下载的固件。
#
# 第 3 项有两份：manifest.json（完整安装）和 manifest-app.json（仅升级 APP）。
#
# GitHub Release 附件不带 CORS 头，网页在 GitHub Pages 上用 fetch() 跨域读不到
# （manifest 本身能下，但 esp-web-tools 紧接着要 fetch 的每个 .bin 分块一样会
# 被浏览器拦下，实测复现过）。所以这两份 manifest 连同它们指向的固件，还要
# **再镜像一份到仓库自己的 firmware-dist/latest/ 目录**，跟 index.html 同源
# 托管，只保留 latest、每次发布覆盖，不留历史版本。网页默认就读这份同源镜像
# （见 index.html 的 MRB_CONFIG.fullManifest/appManifest）。Release 上传的那两份
# （带绝对 GitHub 链接）仍然保留，给手动 esptool 烧录时复制链接用。网络差、
# 下不动的用户还有网页的「本地固件文件」入口：自己下 bin，再用浏览器选中它，
# 页面用 blob 清单交给官方组件，全程不联网取固件。
#
# 改文件名要同步两处：manifest 是用下面的名字拼出来的，而网页
# （index.html 的 MRB_CONFIG.releaseManifest）只认这份 manifest 里的
# name / version / builds，它自己不猜文件名。
# 全片镜像继续叫 .merged.bin 只是给人用 esptool 手工刷时一眼认出来。
# （以后要加 USB CDC 变体：叫 -cdc.full.bin，并在「编译」这步复制一份
#   带 -DARDUINO_USB_CDC_ON_BOOT=1 的构建。）
#
# 版本号：写 firmware/MiRemoteBridge/version_local.h（config.h 会优先包含它），
# 与本地 scripts\build.ps1 -Version 是同一个机制。AGENTS.md 要求发布版的
# BRIDGE_FW_VERSION 与 tag 字符级相同，所以这里直接用 tag 当值。

name: 固件发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 v0.0.6（会创建这个 tag）'
        required: true
        type: string

permissions:
  contents: write

env:
  ARDUINO_CLI_VERSION: '1.5.1'
  ESP32_CORE_VERSION: '3.3.11'
  CORE_INDEX_URL: 'https://espressif.github.io/arduino-esp32/package_esp32_index.json'
  # 与 scripts\_common.ps1 的 Fqbn 逐字一致：FlashMode=dio 是这块板子的硬性要求
  # （QIO 下 Macronix flash 不回答，bootloader 读到全 0xFF 复位循环），
  # PartitionScheme=huge_app 是因为 Wi-Fi 配置栈装不进默认 1.2 MB 应用分区。
  FQBN: 'esp32:esp32:esp32c3:FlashMode=dio,PartitionScheme=huge_app'
  SKETCH: 'firmware/MiRemoteBridge'

jobs:
  release:
    name: 编译并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          case "$V" in
            v*) ;;
            *) echo "::error::版本号必须以 v 开头，拿到的是 [$V]"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次发布版本: $V"
          # SemVer 预发布约定：v1.2.0-rc.1 / -beta.1 / -alpha 这类带连字符的
          # 版本号自动标记为 GitHub pre-release，不参与 latest 竞争；不带连字符
          # 的干净版本号（v1.2.0）视为正式版。测试通过后重新打一个干净版本号
          # 触发正式发布，不是回来编辑这次的 pre-release 标记。
          case "$V" in
            v*-*) IS_PRE=true ;;
            *)    IS_PRE=false ;;
          esac
          echo "prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"
          echo "是否预发布: $IS_PRE"

      - name: 核对 config.h 里受版本控制的版本号
        run: |
          TRACKED=$(grep -m1 -oP '#define\s+BRIDGE_FW_VERSION\s+"\K[^"]+' firmware/MiRemoteBridge/config.h)
          echo "config.h  : ${TRACKED:-<读不到>}"
          echo "本次发布  : ${{ steps.ver.outputs.version }}"
          if [ "$TRACKED" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::warning::BRIDGE_FW_VERSION($TRACKED) 与本次版本不一致。发布版应在同一次改动里对齐（见 AGENTS.md）；带 -后缀 的调试版允许不一致。"
          fi

      - name: 安装 arduino-cli
        run: |
          curl -fsSL -o /tmp/arduino-cli.tar.gz \
            "https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          sudo tar -xzf /tmp/arduino-cli.tar.gz -C /usr/local/bin arduino-cli
          arduino-cli version

      - name: 缓存 Arduino 工具链
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-${{ runner.os }}-cli${{ env.ARDUINO_CLI_VERSION }}-esp32-${{ env.ESP32_CORE_VERSION }}

      - name: 安装 ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "$CORE_INDEX_URL"
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}" --additional-urls "$CORE_INDEX_URL"

      - name: 写入版本号
        run: |
          cat > firmware/MiRemoteBridge/version_local.h <<EOF
          // Generated by .github/workflows/release.yml. Not tracked by git - do not edit.
          #pragma once
          #define BRIDGE_FW_VERSION "${{ steps.ver.outputs.version }}"
          EOF
          cat firmware/MiRemoteBridge/version_local.h

      - name: 编译
        run: |
          arduino-cli compile --fqbn "$FQBN" --output-dir "$GITHUB_WORKSPACE/dist" "$SKETCH"

      - name: 校验固件里真的是这个版本
        run: |
          V="${{ steps.ver.outputs.version }}"
          if strings dist/MiRemoteBridge.ino.bin | grep -qF "$V"; then
            echo "OK   固件里的版本是 $V"
          else
            echo "::error::dist/MiRemoteBridge.ino.bin 里找不到 $V —— 版本号没编进去，多半是缓存复用了旧目标文件"
            exit 1
          fi

      - name: 整理产物
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p out
          cp dist/MiRemoteBridge.ino.merged.bin      "out/MiRemoteBridge-$V.merged.bin"
          cp dist/MiRemoteBridge.ino.bin             "out/MiRemoteBridge-$V-app.bin"
          cp dist/MiRemoteBridge.ino.bootloader.bin  "out/MiRemoteBridge-$V-bootloader.bin"
          cp dist/MiRemoteBridge.ino.partitions.bin  "out/MiRemoteBridge-$V-partitions.bin"

          # boot_app0 不在编译输出里（那里只有带 _flashed 的那份），去 core 包取
          BOOT0=$(find dist "$HOME/.arduino15/packages/esp32/hardware/esp32/${ESP32_CORE_VERSION}" \
                  -name 'boot_app0*.bin' 2>/dev/null | head -1)
          if [ -z "$BOOT0" ]; then
            echo "::error::找不到 boot_app0.bin，分块 manifest 会缺一块"
            exit 1
          fi
          cp "$BOOT0" "out/MiRemoteBridge-$V-boot-app0.bin"
          ls -lh out

      - name: 生成 ESP Web Tools manifest
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          v = os.environ['VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          base = f"https://github.com/{repo}/releases/download/{v}"

          def build(parts):
              return {
                  "name": "MiRemoteBridge",
                  "version": v,
                  # 没有 home_assistant_domain：这不是 ESPHome 设备，加了字段
                  # esp-web-tools 会在装完后弹"Add to Home Assistant"，没意义。
                  "funding_url": f"https://github.com/{repo}",
                  "new_install_prompt_erase": False,
                  "builds": [{"chipFamily": "ESP32-C3", "parts": parts}],
              }

          # 完整安装：分块写（0x0 / 0x8000 / 0xe000 / 0x10000）而不是整片镜像，
          # 因为整片镜像在 0x9000 的 nvs 区间是 0xFF 填充，刷下去等于清配置。
          # 注意：index.html 收到 manifest 后会强制把 new_install_prompt_erase
          # 改回 true，所以弹窗里「擦除」默认勾着 —— 分块只让「不擦」成为可能，
          # 保不保得住还得用户在弹窗里取消那个勾。
          full = build([
              {"path": f"{base}/MiRemoteBridge-{v}-bootloader.bin", "offset": 0},
              {"path": f"{base}/MiRemoteBridge-{v}-partitions.bin", "offset": 0x8000},
              {"path": f"{base}/MiRemoteBridge-{v}-boot-app0.bin", "offset": 0xe000},
              {"path": f"{base}/MiRemoteBridge-{v}-app.bin", "offset": 0x10000},
          ])

          # 仅升级 APP：一个 part，只写应用分区。offset 必须等于分区表里 app0 的
          # 偏移，huge_app 方案下就是 0x10000（见 build 目录里的 partitions.csv）。
          # 网页的「仅升级 APP」入口读这份，没这份那个选项就自动禁用。
          app_only = build([
              {"path": f"{base}/MiRemoteBridge-{v}-app.bin", "offset": 0x10000},
          ])

          def write(path, obj):
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(obj, f, indent=2, ensure_ascii=False)
                  f.write('\n')
              print('wrote', path)

          # manifest.json / manifest-app.json 是固定名，网页永远取 latest 那份，
          # 换版本不用改网页；带版本号的那两份是存档。
          write('out/manifest.json', full)
          write('out/manifest-app.json', app_only)
          write(f'out/manifest-{v}.json', full)
          write(f'out/manifest-app-{v}.json', app_only)
          PY

      - name: 确保 tag 存在（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.version }}"
          git push origin "${{ steps.ver.outputs.version }}"

      - name: 同步同源固件镜像（GitHub Pages 用，规避 Release 附件跨域限制）
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          V="$VERSION"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 这一步会把 worktree 切到 master——必须放在"确保 tag 存在"之后，
          # 否则 workflow_dispatch 手动触发时会把 tag 打在这次新提交上，
          # 而不是打在产出这份固件的源码提交上。
          # checkout@v4 只拉了这次 tag 需要的那点历史，master 分支引用本地还没有。
          git fetch --depth=1 origin master
          git checkout -B master origin/master

          # 只留 latest，不留历史版本；产物是上一步在 out/ 里生成的，
          # 切分支不会动未跟踪目录，仍然在磁盘上。
          rm -rf firmware-dist/latest
          mkdir -p firmware-dist/latest
          cp "out/MiRemoteBridge-$V-bootloader.bin" firmware-dist/latest/
          cp "out/MiRemoteBridge-$V-partitions.bin" firmware-dist/latest/
          cp "out/MiRemoteBridge-$V-boot-app0.bin"  firmware-dist/latest/
          cp "out/MiRemoteBridge-$V-app.bin"        firmware-dist/latest/

          python3 - <<'PY'
          import json, os
          v = os.environ['VERSION']

          def build(parts):
              return {
                  "name": "MiRemoteBridge",
                  "version": v,
                  "new_install_prompt_erase": False,
                  "builds": [{"chipFamily": "ESP32-C3", "parts": parts}],
              }

          # 路径是裸文件名（没有 firmware-dist/latest/ 前缀）：manifest 和这些
          # .bin 是兄弟文件，esp-web-tools 按 manifest 自己的地址解析相对路径。
          full = build([
              {"path": f"MiRemoteBridge-{v}-bootloader.bin", "offset": 0},
              {"path": f"MiRemoteBridge-{v}-partitions.bin", "offset": 0x8000},
              {"path": f"MiRemoteBridge-{v}-boot-app0.bin", "offset": 0xe000},
              {"path": f"MiRemoteBridge-{v}-app.bin", "offset": 0x10000},
          ])
          app_only = build([
              {"path": f"MiRemoteBridge-{v}-app.bin", "offset": 0x10000},
          ])

          for name, obj in (("manifest.json", full), ("manifest-app.json", app_only)):
              with open(f"firmware-dist/latest/{name}", "w", encoding="utf-8") as f:
                  json.dump(obj, f, indent=2, ensure_ascii=False)
                  f.write("\n")
          PY

          git add -f firmware-dist/latest
          if git diff --cached --quiet; then
            echo "firmware-dist/latest 内容没变化，跳过提交"
          else
            git commit -m "chore(pages): 同步 $V 的同源固件镜像（供网页一键安装，规避 Release 附件跨域限制）"
            git push origin master
          fi

      - name: 写发布说明
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          V="$VERSION"
          {
            echo "## 刷哪个"
            echo
            echo "| 你的情况 | 下这个文件 | 说明 |"
            echo "| --- | --- | --- |"
            echo "| 第一次装机 / 用网页一键烧录 | \`MiRemoteBridge-$V.merged.bin\` | 0x0 起始的整片镜像，含 bootloader + 分区表 + app |"
            echo "| 已刷过，只想升级 | \`MiRemoteBridge-$V-app.bin\` | 只写 0x10000，WiFi、按键映射、蓝牙配对全部保留 |"
            echo
            echo "> **整片镜像会清空配置**：merged.bin 在 0x9000 的 nvs 区间是 0xFF 填充，"
            echo "> 刷下去等于恢复出厂。想保住 WiFi、按键映射和蓝牙配对，就刷 \`-app.bin\`"
            echo ">（只写应用分区），或者用网页烧——网页走的是 manifest 的分块写，不清 nvs。"
            echo
            echo "## 命令行刷法"
            echo
            echo '```bash'
            echo "# 升级（保配置）"
            echo "esptool.py --chip esp32c3 --port COM3 --baud 921600 \\"
            echo "  write_flash 0x10000 MiRemoteBridge-$V-app.bin"
            echo
            echo "# 全新装机"
            echo "esptool.py --chip esp32c3 --port COM3 --baud 921600 \\"
            echo "  write_flash 0x0 MiRemoteBridge-$V.merged.bin"
            echo '```'
            echo
            echo "本仓库的 \`scripts\\flash.ps1\` 也是分块写（0x0 / 0x8000 / 0xe000 / 0x10000），不碰 nvs。"
            echo
            echo "## 文件清单"
            echo
            echo '```'
            ls -lh out | tail -n +2 | awk '{printf "%-46s %s\n", $9, $5}'
            echo '```'
            echo
            echo "\`-bootloader.bin\` / \`-partitions.bin\` / \`-boot-app0.bin\` 是 \`manifest.json\`"
            echo "的零件（共约 30 KB），一般不用单独下。"
            echo
            echo "\`manifest.json\` 给完整安装用，\`manifest-app.json\` 给网页的「仅升级 APP」"
            echo "入口用（只写 0x10000）。两份都是固定名，网页永远取 latest 那份，"
            echo "所以发新版不用改网页；带版本号的 \`manifest-$V.json\` 是存档。"
          } > out/notes.md
          cat out/notes.md

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: MiRemoteBridge ${{ steps.ver.outputs.version }}
          body_path: out/notes.md
          prerelease: ${{ steps.ver.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            out/*.bin
            out/manifest.json
            out/manifest-*.json

      - name: 校验 manifest 里的链接真的能下
        run: |
          python3 -c "
          import json
          for name in ('out/manifest.json', 'out/manifest-app.json'):
              m = json.load(open(name))
              for p in m['builds'][0]['parts']:
                  print(p['path'])
          " | sort -u > /tmp/urls.txt
          cat /tmp/urls.txt
          fail=0
          while read -r u; do
            ok=0
            for _ in $(seq 1 12); do
              if curl -fsIL -o /dev/null "$u"; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" = 1 ]; then echo "OK   $u"; else echo "::error::manifest 里的链接取不到: $u"; fail=1; fi
          done < /tmp/urls.txt
          [ "$fail" = 0 ] || exit 1
