# MiRemoteBridge - 固件发布：推 tag 编译成草稿 → 自测 → 选 Latest 发布上官网（只编一次）
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# CI 编译固件，建一个带全部附件的 **Draft Release**（草稿只有仓库成员看得到，
# 不是 latest，官网不动）。你下载固件自己测，然后在 Releases 页面 Edit 这个草稿：
#   - label 选 Latest（或 None）→ Publish：正式版，下面的 sync job 把**已有附件
#     原样**同步到官网 firmware-dist/latest/，不重新编译——官网发出去的就是你测过
#     的那几个字节。
#   - label 选 Pre-release → Publish：公开给别人试用，官网不动；以后再 Edit 改成
#     Latest，GitHub 发出 released 事件，同样同步官网。
# 测出问题：gh release delete v0.1.1 --cleanup-tag，修好重来。
#
# 也可以直接在网页上建 Release、填新 tag 并 Publish（Save draft 不触发任何
# workflow，是 GitHub 的规定）：CI 把固件补到你建的那个 Release 上，是正式版就
# 顺带同步官网。
#
# 防重复编译：Release 上已经有这个版本的 app.bin 就不再编译。网页上建 Release 时
# GitHub 会同时推 tag，push 和 release 两个事件会各起一次运行，按 tag 排队，
# 后跑的那次看到附件已在就跳过。由 CI（GITHUB_TOKEN）建的 Release 不会再触发
# release 事件，不会循环。
#
# 版本号：编译时由 tag 注入（写 version_local.h，config.h 优先包含它），
# config.h 里的 BRIDGE_FW_VERSION 只是本地普通构建的默认值，发布不用改它。
# 与本地 scripts\build.ps1 -Version 是同一个机制。
#
# 出三个东西：
#   1. MiRemoteBridge-<ver>.merged.bin  全片镜像，网页一键烧录 / 全新装机
#   2. MiRemoteBridge-<ver>-app.bin     只写 0x10000 的应用，升级用，配置全留
#   3. manifest.json                    ESP Web Tools 清单，分块写、不清配置
#
# 另外三个几十 KB 的小文件（bootloader / partitions / boot_app0）是第 3 项
# 分块 manifest 的零件，不是给用户单独下载的固件。
# 第 3 项有两份：manifest.json（完整安装）和 manifest-app.json（仅升级 APP）。
#
# GitHub Release 附件不带 CORS 头，网页在 GitHub Pages 上用 fetch() 跨域读不到
# （manifest 本身能下，但 esp-web-tools 紧接着要 fetch 的每个 .bin 分块一样会
# 被浏览器拦下，实测复现过）。所以转正式版时，固件和改成同源相对路径的
# manifest 还要**镜像一份到仓库自己的 firmware-dist/latest/ 目录**，跟
# index.html 同源托管，只保留 latest、每次覆盖。网页默认就读这份同源镜像
# （见 index.html 的 MRB_CONFIG.fullManifest/appManifest）。Release 上传的那两份
# （带绝对 GitHub 链接）仍然保留，给手动 esptool 烧录时复制链接用。网络差、
# 下不动的用户还有网页的「本地固件文件」入口：自己下 bin，再用浏览器选中它，
# 页面用 blob 清单交给官方组件，全程不联网取固件。
#
# 改文件名要同步：build job 拼 manifest 的文件名和 sync job 下载附件、生成
# 同源 manifest 的文件名必须一致；网页（index.html）只认 manifest 里的
# name / version / builds，它自己不猜文件名。
# 全片镜像继续叫 .merged.bin 只是给人用 esptool 手工刷时一眼认出来。
# （以后要加 USB CDC 变体：叫 -cdc.full.bin，并在「编译」这步复制一份
#   带 -DARDUINO_USB_CDC_ON_BOOT=1 的构建。）

name: 固件发布

on:
  push:
    tags:
      - 'v*'
  release:
    # published：预发布或正式版被发布；released：正式版被发布，或预发布改成正式版
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag，例如 v0.1.1：缺固件就补编；已是正式版就重新同步官网（回滚用）'
        required: true
        type: string

# 同一个 tag 同时只跑一次：网页建 Release 会同时触发 push 和 release 两个事件
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ARDUINO_CLI_VERSION: '1.5.1'
  ESP32_CORE_VERSION: '3.3.11'
  CORE_INDEX_URL: 'https://espressif.github.io/arduino-esp32/package_esp32_index.json'
  # 与 scripts\_common.ps1 的 Fqbn 逐字一致：FlashMode=dio 是这块板子的硬性要求
  # （QIO 下 Macronix flash 不回答，bootloader 读到全 0xFF 复位循环），
  # PartitionScheme=huge_app 是因为 Wi-Fi 配置栈装不进默认 1.2 MB 应用分区。
  FQBN: 'esp32:esp32:esp32c3:FlashMode=dio,PartitionScheme=huge_app'
  SKETCH: 'firmware/MiRemoteBridge'

jobs:
  prepare:
    name: 判断要做什么
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      need_build: ${{ steps.state.outputs.need_build }}
    steps:
      - name: 解析版本号
        id: ver
        env:
          V: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          case "$V" in
            v*) ;;
            *) echo "::error::版本号必须以 v 开头，拿到的是 [$V]"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次版本: $V（事件 ${{ github.event_name }} ${{ github.event.action }}）"

      - name: 看 Release 上是否已有固件
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # 已有 app.bin 就不再编译：测过的包一旦挂上去就不换。
          # 要重编：gh release delete <tag> --cleanup-tag 后重新推 tag。
          ASSETS=$(gh release view "$V" --repo "$GITHUB_REPOSITORY" --json assets \
                     --jq '.assets[].name' 2>/dev/null || true)
          if grep -qxF "MiRemoteBridge-$V-app.bin" <<<"$ASSETS"; then
            echo "Release $V 上已有固件，跳过编译"
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 编译并挂到 Release
    needs: prepare
    if: needs.prepare.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.version }}

      - name: 版本号
        id: ver
        run: echo "version=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: 安装 arduino-cli
        run: |
          curl -fsSL -o /tmp/arduino-cli.tar.gz \
            "https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          sudo tar -xzf /tmp/arduino-cli.tar.gz -C /usr/local/bin arduino-cli
          arduino-cli version

      - name: 缓存 Arduino 工具链
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-${{ runner.os }}-cli${{ env.ARDUINO_CLI_VERSION }}-esp32-${{ env.ESP32_CORE_VERSION }}

      - name: 安装 ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "$CORE_INDEX_URL"
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}" --additional-urls "$CORE_INDEX_URL"

      - name: 写入版本号
        run: |
          cat > firmware/MiRemoteBridge/version_local.h <<EOF
          // Generated by .github/workflows/release.yml. Not tracked by git - do not edit.
          #pragma once
          #define BRIDGE_FW_VERSION "${{ steps.ver.outputs.version }}"
          EOF
          cat firmware/MiRemoteBridge/version_local.h

      - name: 编译
        run: |
          arduino-cli compile --fqbn "$FQBN" --output-dir "$GITHUB_WORKSPACE/dist" "$SKETCH"

      - name: 校验固件里真的是这个版本
        run: |
          V="${{ steps.ver.outputs.version }}"
          if strings dist/MiRemoteBridge.ino.bin | grep -qF "$V"; then
            echo "OK   固件里的版本是 $V"
          else
            echo "::error::dist/MiRemoteBridge.ino.bin 里找不到 $V —— 版本号没编进去，多半是缓存复用了旧目标文件"
            exit 1
          fi

      - name: 整理产物
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p out
          cp dist/MiRemoteBridge.ino.merged.bin      "out/MiRemoteBridge-$V.merged.bin"
          cp dist/MiRemoteBridge.ino.bin             "out/MiRemoteBridge-$V-app.bin"
          cp dist/MiRemoteBridge.ino.bootloader.bin  "out/MiRemoteBridge-$V-bootloader.bin"
          cp dist/MiRemoteBridge.ino.partitions.bin  "out/MiRemoteBridge-$V-partitions.bin"

          # boot_app0 不在编译输出里（那里只有带 _flashed 的那份），去 core 包取
          BOOT0=$(find dist "$HOME/.arduino15/packages/esp32/hardware/esp32/${ESP32_CORE_VERSION}" \
                  -name 'boot_app0*.bin' 2>/dev/null | head -1)
          if [ -z "$BOOT0" ]; then
            echo "::error::找不到 boot_app0.bin，分块 manifest 会缺一块"
            exit 1
          fi
          cp "$BOOT0" "out/MiRemoteBridge-$V-boot-app0.bin"
          ls -lh out

      - name: 生成 ESP Web Tools manifest
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          v = os.environ['VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          base = f"https://github.com/{repo}/releases/download/{v}"

          def build(parts):
              return {
                  "name": "MiRemoteBridge",
                  "version": v,
                  # 没有 home_assistant_domain：这不是 ESPHome 设备，加了字段
                  # esp-web-tools 会在装完后弹"Add to Home Assistant"，没意义。
                  "funding_url": f"https://github.com/{repo}",
                  "new_install_prompt_erase": False,
                  "builds": [{"chipFamily": "ESP32-C3", "parts": parts}],
              }

          # 完整安装：分块写（0x0 / 0x8000 / 0xe000 / 0x10000）而不是整片镜像，
          # 因为整片镜像在 0x9000 的 nvs 区间是 0xFF 填充，刷下去等于清配置。
          # 注意：index.html 收到 manifest 后会强制把 new_install_prompt_erase
          # 改回 true，所以弹窗里「擦除」默认勾着 —— 分块只让「不擦」成为可能，
          # 保不保得住还得用户在弹窗里取消那个勾。
          full = build([
              {"path": f"{base}/MiRemoteBridge-{v}-bootloader.bin", "offset": 0},
              {"path": f"{base}/MiRemoteBridge-{v}-partitions.bin", "offset": 0x8000},
              {"path": f"{base}/MiRemoteBridge-{v}-boot-app0.bin", "offset": 0xe000},
              {"path": f"{base}/MiRemoteBridge-{v}-app.bin", "offset": 0x10000},
          ])

          # 仅升级 APP：一个 part，只写应用分区。offset 必须等于分区表里 app0 的
          # 偏移，huge_app 方案下就是 0x10000（见 build 目录里的 partitions.csv）。
          # 网页的「仅升级 APP」入口读这份，没这份那个选项就自动禁用。
          app_only = build([
              {"path": f"{base}/MiRemoteBridge-{v}-app.bin", "offset": 0x10000},
          ])

          def write(path, obj):
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(obj, f, indent=2, ensure_ascii=False)
                  f.write('\n')
              print('wrote', path)

          # manifest.json / manifest-app.json 是固定名，网页永远取 latest 那份，
          # 换版本不用改网页；带版本号的那两份是存档。
          write('out/manifest.json', full)
          write('out/manifest-app.json', app_only)
          write(f'out/manifest-{v}.json', full)
          write(f'out/manifest-app-{v}.json', app_only)
          PY

      - name: 写发布说明
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          V="$VERSION"
          {
            echo "**MiRemoteBridge** makes your PC see a Bluetooth remote as an ordinary Bluetooth keyboard, on an ESP32-C3 board that costs about \$5."
            echo
            echo "Project site — flashing, Wi-Fi setup and key remapping all happen in the browser: <https://qyhhhh.github.io/BleRemoteBrideg/>"
            echo
            echo "## What it does"
            echo
            echo "- **Standard Bluetooth HID.** The PC pairs with a plain keyboard + media-control device. No driver, no companion app, no admin rights, nothing written to the registry, nothing for anti-cheat or antivirus to trip over."
            echo "- **Xiaomi Bluetooth Remote 2 Pro (RC003): all 13 keys**, including the ones Windows cannot read on its own — the board converts them to standard HID before sending them on. Remote battery level is reported too."
            echo "- **Learning mode for other BLE remotes.** Press a key, the board records its raw code, then bind whatever shortcut you want (verified with China Mobile CMCC_Voice_Remote)."
            echo "- **Three remote slots**, each keeping its own key mapping, stored on the board."
            echo "- **Remapping in the browser.** Single keys, modifier combos, media and system actions; the key you press lights up live over WebSocket; Bluetooth link, Wi-Fi window and free heap on the same page. The page is fully offline and self-contained, in English or 中文."
            echo "- **Browser install and Wi-Fi provisioning** through ESP Web Tools and Improv Wi-Fi on the project site; the app-only update keeps your Wi-Fi, mappings and pairings."
            echo "- **Local and quiet.** Keys are translated on the board and forwarded over Bluetooth; the config page Wi-Fi only opens inside a 30-minute window you start with the BOOT button; no telemetry."
            echo
            echo "Verified on Windows 10 / 11 with the RC003 and CMCC_Voice_Remote. Linux and macOS are not verified; iOS is not supported."
            echo
            echo "## 功能"
            echo
            echo "- **标准蓝牙 HID**：电脑连上的就是一个普通蓝牙键盘 + 媒体控制设备。不装驱动、不装软件、不要管理员权限、不改注册表，也不碰游戏反作弊和杀毒软件。"
            echo "- **小米蓝牙遥控器 2 Pro（RC003）13 键全支持**，包括 Windows 自己识别不了的特殊键——由开发板转成标准 HID 再发给电脑，同时上报遥控器电量。"
            echo "- **第三方 BLE 遥控器学习模式**：按一个键就记下原始码，再绑定你要的快捷键（已实测中国移动 CMCC_Voice_Remote）。"
            echo "- **3 个遥控器槽位**，各自保存按键映射，存在开发板上。"
            echo "- **在浏览器里改键**：单键、组合键、媒体与系统动作；按下的键通过 WebSocket 实时高亮；蓝牙连接、Wi-Fi 窗口、堆内存同页可见。页面完全离线自包含，中英文可切。"
            echo "- **网页烧录与配网**：官网走 ESP Web Tools + Improv Wi-Fi；「仅升级 APP」会保留 Wi-Fi、按键映射和蓝牙配对。"
            echo "- **本地、安静**：按键在板上转换后走蓝牙转发；配置页的 Wi-Fi 只在你按 BOOT 打开的 30 分钟窗口里开放；没有任何遥测。"
            echo
            echo "已实测 Windows 10 / 11 + RC003 + CMCC_Voice_Remote；Linux / macOS 未验证，iOS 不支持。"
            echo
            echo "## 刷哪个"
            echo
            echo "| 你的情况 | 下这个文件 | 说明 |"
            echo "| --- | --- | --- |"
            echo "| 第一次装机 / 用网页一键烧录 | \`MiRemoteBridge-$V.merged.bin\` | 0x0 起始的整片镜像，含 bootloader + 分区表 + app |"
            echo "| 已刷过，只想升级 | \`MiRemoteBridge-$V-app.bin\` | 只写 0x10000，WiFi、按键映射、蓝牙配对全部保留 |"
            echo
            echo "> **整片镜像会清空配置**：merged.bin 在 0x9000 的 nvs 区间是 0xFF 填充，"
            echo "> 刷下去等于恢复出厂。想保住 WiFi、按键映射和蓝牙配对，就刷 \`-app.bin\`"
            echo ">（只写应用分区），或者用网页烧——网页走的是 manifest 的分块写，不清 nvs。"
            echo
            echo "## 命令行刷法"
            echo
            echo '```bash'
            echo "# 升级（保配置）"
            echo "esptool.py --chip esp32c3 --port COM3 --baud 921600 \\"
            echo "  write_flash 0x10000 MiRemoteBridge-$V-app.bin"
            echo
            echo "# 全新装机"
            echo "esptool.py --chip esp32c3 --port COM3 --baud 921600 \\"
            echo "  write_flash 0x0 MiRemoteBridge-$V.merged.bin"
            echo '```'
            echo
            echo "本仓库的 \`scripts\\flash.ps1\` 也是分块写（0x0 / 0x8000 / 0xe000 / 0x10000），不碰 nvs。"
            echo
            echo "## 文件清单"
            echo
            echo '```'
            ls -lh out | tail -n +2 | awk '{printf "%-46s %s\n", $9, $5}'
            echo '```'
            echo
            echo "\`-bootloader.bin\` / \`-partitions.bin\` / \`-boot-app0.bin\` 是 \`manifest.json\`"
            echo "的零件（共约 30 KB），一般不用单独下。"
            echo
            echo "\`manifest.json\` 给完整安装用，\`manifest-app.json\` 给网页的「仅升级 APP」"
            echo "入口用（只写 0x10000）。两份都是固定名，网页永远取 latest 那份，"
            echo "所以发新版不用改网页；带版本号的 \`manifest-$V.json\` 是存档。"
          } > out/notes.md
          cat out/notes.md

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          FILES=(out/*.bin out/manifest.json out/manifest-*.json)
          if gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 网页上建的 Release：上传附件，把生成的说明接在你写的文字后面
            gh release view "$V" --repo "$GITHUB_REPOSITORY" --json body --jq .body > out/body.md
            { echo; echo; cat out/notes.md; } >> out/body.md
            gh release upload "$V" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
            gh release edit "$V" --repo "$GITHUB_REPOSITORY" --notes-file out/body.md
            echo "已上传到现有 Release $V"
          else
            # 只推了 tag：新建草稿，等你测完在网页上选 Latest / Pre-release 发布。
            # GITHUB_TOKEN 建的草稿不触发 release 事件；你在网页上点 Publish 才触发。
            gh release create "$V" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "MiRemoteBridge $V" --notes-file out/notes.md "${FILES[@]}"
            echo "已新建草稿 $V"
          fi
          {
            echo "### 固件已挂到 $V"
            echo
            echo "1. 打开 [Releases](https://github.com/$GITHUB_REPOSITORY/releases) 找到 $V，下载 \`-app.bin\` 刷机验证。"
            echo "2. 没问题：Edit → Release label 选 **Latest** → Publish / Update release，官网随之更新。选 Pre-release 则只公开、不上官网。"
            echo "3. 有问题：\`gh release delete $V --cleanup-tag\`，修好重来。"
          } >> "$GITHUB_STEP_SUMMARY"

  sync:
    name: 同步官网 firmware-dist/latest
    needs: [prepare, build]
    # build 被跳过（固件已在）也要跑；build 失败就不跑
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: 只有正式版才上官网
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          INFO=$(gh release view "$V" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)
          echo "$V: $INFO"
          if [ "$(jq -r '.isDraft or .isPrerelease' <<<"$INFO")" = true ]; then
            echo "::notice::$V 还是草稿或预发布，不同步官网。测完在 Release 页面选 Latest 发布即可上官网"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          ref: master

      - name: 下载 Release 附件并生成同源 manifest
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          V="$VERSION"

          rm -rf firmware-dist/latest
          mkdir -p firmware-dist/latest
          for part in bootloader partitions boot-app0 app; do
            gh release download "$V" --repo "$GITHUB_REPOSITORY" \
              --pattern "MiRemoteBridge-$V-$part.bin" --dir firmware-dist/latest
          done
          ls -lh firmware-dist/latest

          # 固件里的版本号必须就是这个 tag，防止附件传错
          if ! strings "firmware-dist/latest/MiRemoteBridge-$V-app.bin" | grep -qF "$V"; then
            echo "::error::MiRemoteBridge-$V-app.bin 里找不到版本号 $V"
            exit 1
          fi

          python3 - <<'PY'
          import json, os
          v = os.environ['VERSION']

          def build(parts):
              return {
                  "name": "MiRemoteBridge",
                  "version": v,
                  "new_install_prompt_erase": False,
                  "builds": [{"chipFamily": "ESP32-C3", "parts": parts}],
              }

          # 路径是裸文件名（没有 firmware-dist/latest/ 前缀）：manifest 和这些
          # .bin 是兄弟文件，esp-web-tools 按 manifest 自己的地址解析相对路径。
          full = build([
              {"path": f"MiRemoteBridge-{v}-bootloader.bin", "offset": 0},
              {"path": f"MiRemoteBridge-{v}-partitions.bin", "offset": 0x8000},
              {"path": f"MiRemoteBridge-{v}-boot-app0.bin", "offset": 0xe000},
              {"path": f"MiRemoteBridge-{v}-app.bin", "offset": 0x10000},
          ])
          app_only = build([
              {"path": f"MiRemoteBridge-{v}-app.bin", "offset": 0x10000},
          ])

          for name, obj in (("manifest.json", full), ("manifest-app.json", app_only)):
              with open(f"firmware-dist/latest/{name}", "w", encoding="utf-8") as f:
                  json.dump(obj, f, indent=2, ensure_ascii=False)
                  f.write("\n")
          PY

      - name: 提交到 master
        if: steps.gate.outputs.go == 'true'
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f firmware-dist/latest
          if git diff --cached --quiet; then
            echo "firmware-dist/latest 内容没变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(pages): 同步 $V 的同源固件镜像（供网页一键安装，规避 Release 附件跨域限制）"
          # master 可能刚被别人推过，rebase 后重试
          for i in 1 2 3; do
            git push origin HEAD:master && exit 0
            git pull --rebase origin master
          done
          echo "::error::推送 master 失败"
          exit 1

      - name: 校验 Release 里 manifest 的链接真的能下
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.prepare.outputs.version }}
        run: |
          gh release download "$V" --repo "$GITHUB_REPOSITORY" \
            --pattern manifest.json --pattern manifest-app.json --dir /tmp/m
          python3 -c "
          import json
          for name in ('/tmp/m/manifest.json', '/tmp/m/manifest-app.json'):
              m = json.load(open(name))
              for p in m['builds'][0]['parts']:
                  print(p['path'])
          " | sort -u > /tmp/urls.txt
          cat /tmp/urls.txt
          fail=0
          while read -r u; do
            ok=0
            for _ in $(seq 1 12); do
              if curl -fsIL -o /dev/null "$u"; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" = 1 ]; then echo "OK   $u"; else echo "::error::manifest 里的链接取不到: $u"; fail=1; fi
          done < /tmp/urls.txt
          [ "$fail" = 0 ] || exit 1
